services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=selfblog'
      - 'POSTGRES_PASSWORD=123456'
      - 'POSTGRES_USER=root'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
volumes:
  postgres_data: